# Venom Guitars admin (Sveltia CMS). Edits are saved as commits to the GitHub repo.
backend:
  name: github
  repo: venomguitars/VenomGuitars
  branch: main
site_url: https://venomguitars.com.au
media_folder: images
public_folder: /images
publish_mode: simple
locale: en
collections:
- name: pages
  label: Pages & settings
  files:
  - name: site
    label: Site settings (email, social links, footer)
    file: content/site.json
    fields:
    - name: email
      label: Contact email
      widget: string
    - name: facebook
      label: Facebook URL
      widget: string
    - name: instagram
      label: Instagram URL
      widget: string
    - name: tiktok
      label: TikTok URL
      widget: string
    - name: youtube
      label: YouTube URL
      widget: string
    - name: tagline
      label: Footer tagline
      widget: string
    - name: footer_desc
      label: Footer description
      widget: text
    - name: copyright
      label: Copyright line
      widget: string
      hint: '[[Venom Guitars]] shows the brand name in red.'
  - name: home
    label: Home page
    file: content/home.json
